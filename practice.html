<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <title>코딩 실습실</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app" id="app">

  <div class="main">

    <!-- 왼쪽 패널 -->
    <div class="left-panel">
      <div class="lesson-header">
        <a class="back-link" href="index.html">← 실습 목록</a>
        <div class="chapter-badge" id="chapter-badge"></div>
        <div class="lesson-title"  id="lesson-title"></div>
      </div>
      <div class="steps-nav"   id="steps-nav"></div>
      <div class="mission-body" id="mission-body"></div>
    </div>

    <!-- 오른쪽 패널 -->
    <div class="right-panel" id="right-panel">

      <div class="editor-header">
        <div class="session-label" id="session-label"></div>
        <div class="editor-actions">
          <button id="theme-btn" class="theme-btn" onclick="toggleTheme()" title="라이트/다크 전환"></button>
          <button class="reset-btn" onclick="resetCode()">초기화</button>
          <button class="run-btn" id="run-btn" onclick="runCode('all')" title="전체 실행 후 채점합니다 (Ctrl/⌘ + Shift + Enter)">▶ 전체 실행</button>
        </div>
      </div>

      <div class="editor-wrap" id="code-editor-wrap"></div>

      <div class="output-panel" id="output-panel">
        <div class="resizer-top" id="resizer-top"></div>

        <div class="output-header">
          <span class="output-label">출력</span>
          <span class="output-status" id="output-status"></span>
        </div>

        <div class="output-container" id="output-container">
          <div class="output-body" id="output-body">
            <span class="output-placeholder">코드를 실행하면 결과가 여기에 나타나요.</span>
          </div>
          <div id="output-plots"></div>
        </div>
      </div>

    </div><!-- /.right-panel -->

  </div><!-- /.main -->

  <footer class="app-footer">
    <div class="footer-left">
      <span class="footer-dev">개발자: 최용진</span>
      <span class="footer-affil">런던위생열대의학대학원 (LSHTM)</span>
      <a class="footer-email" href="mailto:Yongjin.Choi@lshtm.ac.uk">Yongjin.Choi@lshtm.ac.uk</a>
    </div>
    <div class="footer-right" id="footer-right"></div>
  </footer>

  <!-- 단계 완료 모달 -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-card" style="position:relative;">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-icon">✓</div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-impl"  id="modal-impl"></div>
      <div class="modal-sub"   id="modal-sub"></div>
      <button class="modal-next-btn" id="modal-next-btn" onclick="nextStep()">다음 단계 →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</div><!-- /.app -->

<script src="courses.js"></script>
<script src="lessons/workflow.js"></script>
<script src="lessons/nn.js"></script>
<script src="lessons/ensemble.js"></script>
<script src="app.js"></script>

<script>
  function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  /* 출력 패널 높이 조절 */
  (function () {
    const panel   = document.getElementById('output-panel');
    const resizer = document.getElementById('resizer-top');
    let isResizing = false, startY, startHeight;
    resizer.addEventListener('mousedown', (e) => {
      isResizing = true; startY = e.clientY;
      startHeight = parseInt(getComputedStyle(panel).height, 10);
      const onMove = (ev) => {
        if (!isResizing) return;
        const newH = startHeight + (startY - ev.clientY);
        if (newH >= 100 && newH <= window.innerHeight * 0.8) panel.style.height = newH + 'px';
      };
      const onUp = () => {
        isResizing = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  })();
</script>

</body>
</html>
