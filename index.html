<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R 코딩 실습실</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">

  <div class="main">

    <div class="left-panel">
      <div class="lesson-header">
        <div class="chapter-badge" id="chapter-badge"></div>
        <div class="lesson-title" id="lesson-title"></div>
      </div>
      <div class="steps-nav" id="steps-nav"></div>
      <div class="mission-body" id="mission-body"></div>
    </div>

    <div class="right-panel">
      <div class="editor-header">
        <div class="editor-actions">
          <button class="reset-btn" onclick="resetCode()">초기화</button>
          <button class="run-btn" id="run-btn" onclick="runCode()">▶ 실행</button>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea id="code-editor" spellcheck="false" autocomplete="off"></textarea>
      </div>
      <div class="output-panel">
        <div class="output-header">
          <span class="output-label">출력</span>
          <span class="output-status" id="output-status"></span>
        </div>
        <div class="output-body" id="output-body">
          <span class="output-placeholder">코드를 실행하면 결과가 여기에 나타나요.</span>
        </div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-icon">✓</div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-sub" id="modal-sub"></div>
      <button class="modal-next-btn" onclick="nextStep()">다음 →</button>
    </div>
  </div>

</div>
<script src="lessons.js"></script>
<script src="r-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
