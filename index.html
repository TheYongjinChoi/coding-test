<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <title>코딩 실습실</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app" id="app">

  <!-- ── 메인 레이아웃 ── -->
  <div class="main">

    <!-- 왼쪽 패널 -->
    <div class="left-panel">
      <div class="lesson-header">
        <div class="chapter-badge" id="chapter-badge"></div>
        <div class="lesson-title"  id="lesson-title"></div>
      </div>
      <div class="steps-nav"   id="steps-nav"></div>
      <div class="mission-body" id="mission-body"></div>
    </div>

    <!-- 오른쪽 패널 -->
    <div class="right-panel" id="right-panel">

      <div class="editor-header">
        <div class="editor-actions">
          <button id="theme-btn" class="theme-btn" onclick="toggleTheme()" title="라이트/다크 전환">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            라이트 모드
          </button>
          <button class="reset-btn" onclick="resetCode()">초기화</button>
          <button class="run-btn" id="run-btn" onclick="runCode()">▶ 실행</button>
        </div>
      </div>

      <div class="editor-wrap" id="code-editor-wrap"></div>

      <div class="output-panel" id="output-panel">
        <div class="resizer-top" id="resizer-top"></div>

        <div class="output-header">
          <span class="output-label">출력</span>
          <span class="output-status" id="output-status"></span>
        </div>

        <div class="output-container" id="output-container">
          <div class="output-body" id="output-body">
            <span class="output-placeholder">코드를 실행하면 결과가 여기에 나타나요.</span>
          </div>
          <div id="output-plot-wrap" style="display:none;">
            <div style="width:100%;text-align:center;">
              <img id="output-plot" src="" alt="R Plot">
            </div>
          </div>
        </div>
      </div>

    </div><!-- /.right-panel -->

  </div><!-- /.main -->

  <!-- ── 푸터 ── -->
  <footer class="app-footer">
    <div class="footer-left">
      <span class="footer-dev">개발자: 최용진</span>
      <span class="footer-affil">런던위생열대의학대학원 (LSHTM)</span>
      <a class="footer-email" href="mailto:Yongjin.Choi@lshtm.ac.uk">Yongjin.Choi@lshtm.ac.uk</a>
    </div>
    <div class="footer-right">
      이 학습 애플리케이션은 R 4.6.0과 GitHub 기반으로 개발되었습니다.
    </div>
  </footer>

  <!-- ── 완료 모달 ── -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-card" style="position:relative;">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-icon">✓</div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-impl"  id="modal-impl"></div>
      <div class="modal-sub"   id="modal-sub"></div>
      <button class="modal-next-btn" onclick="nextStep()">다음 단계 →</button>
    </div>
  </div>

  <!--
  닉네임 모달 (현재 비활성화)
  <div class="modal-overlay" id="nickname-overlay" style="display:none;">
    <div class="modal-card nickname-card">
      <div class="nickname-title">👋 반갑습니다!</div>
      <div class="nickname-desc">
        실습을 시작하기 전에 닉네임을 입력해주세요.<br>
        <span class="nickname-tip">💡 매 세션에서 동일한 닉네임을 사용하시길 권장합니다.</span>
      </div>
      <input
        type="text"
        id="nickname-input"
        class="nickname-input"
        placeholder="닉네임 입력..."
        maxlength="20"
        onkeydown="handleNicknameKey(event)"
      />
      <div class="nickname-error" id="nickname-error" style="display:none;">닉네임을 입력해주세요.</div>
      <button class="modal-next-btn" onclick="submitNickname()">실습 시작 →</button>
    </div>
  </div>
  -->

</div><!-- /.app -->

<script src="lessons.js"></script>
<script src="app.js"></script>

<script>
  /* ── 모달 닫기 ── */
  function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  /* ── 출력 패널 리사이즈 ── */
  (function () {
    const panel   = document.getElementById('output-panel');
    const resizer = document.getElementById('resizer-top');
    let isResizing = false, startY, startHeight;

    resizer.addEventListener('mousedown', (e) => {
      isResizing  = true;
      startY      = e.clientY;
      startHeight = parseInt(getComputedStyle(panel).height, 10);

      const onMove = (e) => {
        if (!isResizing) return;
        const newH = startHeight + (startY - e.clientY);
        if (newH >= 100 && newH <= window.innerHeight * 0.8) {
          panel.style.height = newH + 'px';
        }
      };
      const onUp = () => {
        isResizing = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup',   onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup',   onUp);
    });
  })();
</script>

</body>
</html>
