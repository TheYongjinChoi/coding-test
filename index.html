<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>코딩 실습실</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="hub">

  <header class="hub-header">
    <div>
      <div class="hub-kicker">머신러닝 · 인과추론 워크숍</div>
      <h1 class="hub-title">코딩 실습실</h1>
      <p class="hub-desc">
        패키지 설치 없이 브라우저에서 바로 R 코드를 실행합니다.
        아래에서 실습 세션을 고르세요. 세션을 마치면 이 화면으로 돌아옵니다.
      </p>
    </div>
    <button id="theme-btn" class="theme-btn" onclick="toggleTheme()" title="라이트/다크 전환"></button>
  </header>

  <section class="hub-bar">
    <div class="hub-field">
      <label for="student-id">수강자 ID</label>
      <input id="student-id" type="text" maxlength="20" placeholder="예: 2026001"
             oninput="onStudentInput()" />
      <span class="hub-field-help">진척도 기록에 사용됩니다. 매 세션 같은 ID를 사용하세요.</span>
    </div>
    <div class="hub-status">
      <span class="status-dot" id="server-dot"></span>
      <span id="server-text">R 서버 상태 확인 중…</span>
    </div>
  </section>

  <section class="session-grid" id="session-grid"></section>

  <footer class="app-footer">
    <div class="footer-left">
      <span class="footer-dev">개발자: 최용진</span>
      <span class="footer-affil">런던위생열대의학대학원 (LSHTM)</span>
      <a class="footer-email" href="mailto:Yongjin.Choi@lshtm.ac.uk">Yongjin.Choi@lshtm.ac.uk</a>
    </div>
    <div class="footer-right">이 학습 애플리케이션은 R과 GitHub 기반으로 개발되었습니다.</div>
  </footer>

</div>

<script src="courses.js"></script>
<script src="lessons/workflow.js"></script>
<script src="lessons/nn.js"></script>
<script src="lessons/ensemble.js"></script>
<script>
/* ── 수강자 ID ─────────────────────────────────────────── */
function onStudentInput() {
  setStudentId(document.getElementById('student-id').value);
  renderSessions();
}

/* ── 세션 카드 ─────────────────────────────────────────── */
function renderSessions() {
  const grid = document.getElementById('session-grid');
  const hasId = getStudentId().length > 0;

  grid.innerHTML = SESSION_ORDER.map(meta => {
    const course = COURSES[meta.id];
    if (!course) return '';

    const total = countSteps(course);
    const done  = sessionProgress(meta.id).done.length;
    const pct   = total ? Math.round(done / total * 100) : 0;
    const state = done === 0 ? 'start' : (done >= total ? 'done' : 'resume');
    const label = state === 'start' ? '시작하기' : state === 'done' ? '다시 보기' : '이어하기';

    return `
      <article class="session-card ${state === 'done' ? 'is-done' : ''}"
               style="--accent:${course.color}">
        <div class="session-top">
          <span class="session-badge">${course.title.split('.')[0]}강</span>
          ${state === 'done' ? '<span class="session-complete">완료</span>' : ''}
          ${course.tracker ? '' : '<span class="session-tag">자체 채점</span>'}
        </div>
        <h2 class="session-name">${course.title.replace(/^\d+강\.\s*/, '')}</h2>
        <p class="session-sub">${course.subtitle}</p>
        <p class="session-note">${meta.note}</p>

        <div class="session-meta">
          <span>${course.chapters.length}개 파트 · ${total}단계</span>
          <span>예상 ${meta.est}</span>
        </div>

        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-text">${done} / ${total} 단계 완료</div>

        <div class="session-actions">
          <button class="session-btn" ${hasId ? '' : 'disabled'}
                  onclick="openSession('${meta.id}')">${label} →</button>
          ${done > 0 ? `<button class="session-reset" onclick="resetSession('${meta.id}')">진척도 초기화</button>` : ''}
        </div>
        ${hasId ? '' : '<div class="session-lock">수강자 ID를 먼저 입력하세요.</div>'}
      </article>`;
  }).join('');
}

function openSession(id) {
  location.href = `practice.html?session=${encodeURIComponent(id)}`;
}
function resetSession(id) {
  if (!confirm('이 세션의 진척도를 지웁니다. 계속할까요?')) return;
  resetSessionProgress(id);
  renderSessions();
}

/* ── R 서버 상태 (무료 플랜은 첫 요청이 느립니다) ───────── */
async function pingServer() {
  const dot  = document.getElementById('server-dot');
  const text = document.getElementById('server-text');
  text.textContent = 'R 서버를 깨우는 중… (최대 60초)';
  try {
    const t0 = Date.now();
    const res = await fetch(`${API_URL}/health`);
    const data = await res.json();
    if (unbox(data.status) === 'ok') {
      dot.classList.add('ok');
      text.textContent = `R 서버 준비 완료 (${((Date.now() - t0) / 1000).toFixed(1)}초)${shard}`;
      return;
    }
    throw new Error();
  } catch (e) {
    dot.classList.add('err');
    text.textContent = 'R 서버에 연결하지 못했습니다. 잠시 후 새로고침하세요.';
  }
}

/* ── 시작 ──────────────────────────────────────────────── */
window.addEventListener('load', () => {
  applyTheme(localStorage.getItem('theme') || 'dark');
  document.getElementById('student-id').value = getStudentId();

  const doneParam = new URLSearchParams(location.search).get('done');
  renderSessions();
  if (doneParam && COURSES[doneParam]) {
    const card = document.querySelector('.session-card');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  pingServer();
});
</script>

</body>
</html>
