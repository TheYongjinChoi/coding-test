<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R 실습 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .dash-app { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); color: var(--text); }
    .dash-header { padding: 16px 24px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .dash-title { font-size: 18px; font-weight: 600; color: var(--mk-white); }
    .dash-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text3); }
    .dash-live { display: flex; align-items: center; gap: 6px; color: var(--mk-green); font-size: 13px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mk-green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .session-bar { padding: 10px 24px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--bg2); }
    .session-bar label { font-size: 13px; color: var(--text2); }
    .session-input { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: var(--sans); font-size: 13px; padding: 5px 10px; outline: none; width: 200px; }
    .session-btn { padding: 5px 14px; background: var(--teal); color: white; border: none; border-radius: var(--radius); font-family: var(--sans); font-size: 13px; cursor: pointer; }
    .session-btn:hover { background: var(--teal-d); }
    .export-btn { padding: 5px 14px; background: transparent; color: var(--text2); border: 0.5px solid var(--border2); border-radius: var(--radius); font-family: var(--sans); font-size: 13px; cursor: pointer; margin-left: auto; }
    .export-btn:hover { background: var(--bg3); color: var(--text); }

    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 24px; }
    .stat-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; }
    .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 600; color: var(--mk-white); font-family: var(--mono); }
    .stat-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }

    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 24px 24px; flex: 1; }
    .dash-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
    .dash-card.full { grid-column: 1 / -1; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }

    .chart-wrap { position: relative; height: 220px; }

    /* 리더보드 */
    .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lb-table th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); padding: 0 8px 8px; border-bottom: 0.5px solid var(--border); }
    .lb-table td { padding: 8px 8px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-rank { font-family: var(--mono); font-weight: 600; color: var(--text3); width: 28px; }
    .lb-rank.top3 { color: var(--mk-yellow); }
    .lb-name { font-weight: 500; color: var(--mk-white); }
    .lb-steps { font-family: var(--mono); color: var(--mk-green); }
    .lb-bar-wrap { width: 80px; }
    .lb-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
    .lb-bar-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.4s; }

    /* 단계별 테이블 */
    .step-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .step-table th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); padding: 0 8px 8px; border-bottom: 0.5px solid var(--border); }
    .step-table td { padding: 7px 8px; border-bottom: 0.5px solid var(--border); color: var(--text); }
    .step-table tr:last-child td { border-bottom: none; }
    .step-pct { font-family: var(--mono); color: var(--mk-green); font-weight: 500; }
    .step-num { font-family: var(--mono); color: var(--text2); }
    .pct-bar { height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .pct-bar-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.4s; }

    .empty-state { color: var(--text3); font-size: 13px; text-align: center; padding: 32px 0; }

    .dash-footer { padding: 10px 24px; border-top: 0.5px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); background: var(--bg2); }
  </style>
</head>
<body>
<div class="dash-app">

  <div class="dash-header">
    <div class="dash-title">📊 R 실습 대시보드</div>
    <div class="dash-meta">
      <div class="dash-live"><div class="live-dot"></div> 실시간</div>
      <span id="updated-at">—</span>
    </div>
  </div>

  <div class="session-bar">
    <label>세션</label>
    <input type="text" class="session-input" id="session-input" placeholder="전체 (비워두면 전체 조회)" />
    <button class="session-btn" onclick="loadData()">조회</button>
    <button class="export-btn" onclick="exportCSV()">⬇ CSV 다운로드</button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">전체 참여 학생</div>
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-sub">누적 닉네임 수</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">현재 접속 중</div>
      <div class="stat-value" id="stat-active">—</div>
      <div class="stat-sub">최근 3분 이내 활동</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">완료된 단계 수</div>
      <div class="stat-value" id="stat-steps">—</div>
      <div class="stat-sub">전체 완료 이벤트</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 소요 시간</div>
      <div class="stat-value" id="stat-avgtime">—</div>
      <div class="stat-sub">단계당 평균 (초)</div>
    </div>
  </div>

  <div class="dash-grid">

    <!-- 단계별 완료율 차트 -->
    <div class="dash-card">
      <div class="card-title">단계별 완료율</div>
      <div class="chart-wrap">
        <canvas id="completion-chart"></canvas>
      </div>
    </div>

    <!-- 단계별 평균 시도 횟수 차트 -->
    <div class="dash-card">
      <div class="card-title">단계별 평균 시도 횟수</div>
      <div class="chart-wrap">
        <canvas id="attempts-chart"></canvas>
      </div>
    </div>

    <!-- 단계별 상세 테이블 -->
    <div class="dash-card">
      <div class="card-title">단계별 상세</div>
      <div id="step-table-wrap"><div class="empty-state">데이터 없음</div></div>
    </div>

    <!-- 리더보드 -->
    <div class="dash-card">
      <div class="card-title">🏆 진척도 상위 10명</div>
      <div id="leaderboard-wrap"><div class="empty-state">데이터 없음</div></div>
    </div>

  </div>

  <div class="dash-footer">
    <span>개발자: 최용진 · LSHTM · <a href="mailto:Yongjin.Choi@lshtm.ac.uk" style="color:var(--teal)">Yongjin.Choi@lshtm.ac.uk</a></span>
    <span>R 4.3.2 · GitHub 기반</span>
  </div>

</div>

<script>
const API_URL = "https://coding-api-enum.onrender.com";
let completionChart = null;
let attemptsChart   = null;
let totalSteps      = 0;

async function loadData() {
  const session = document.getElementById('session-input').value.trim();
  const url = session
    ? `${API_URL}/dashboard/data?session=${encodeURIComponent(session)}`
    : `${API_URL}/dashboard/data`;

  try {
    const res  = await fetch(url);
    const data = await res.json();
    renderDashboard(data);
  } catch(e) {
    console.error('대시보드 데이터 로드 실패:', e);
  }
}

function renderDashboard(data) {
  // 통계 카드
  document.getElementById('stat-total').textContent  = data.total_students ?? '—';
  document.getElementById('stat-active').textContent = data.active_now ?? '—';
  document.getElementById('updated-at').textContent  = '업데이트: ' + (data.updated_at ?? '—');

  const steps = data.step_completion || [];
  totalSteps  = steps.length;

  const totalCompleted = steps.reduce((s, r) => s + (r.completed || 0), 0);
  document.getElementById('stat-steps').textContent = totalCompleted;

  const avgTime = steps.length > 0
    ? Math.round(steps.reduce((s, r) => s + (r.avg_time || 0), 0) / steps.length)
    : '—';
  document.getElementById('stat-avgtime').textContent = avgTime;

  // 완료율 차트
  renderCompletionChart(steps, data.total_students);

  // 시도 횟수 차트
  renderAttemptsChart(steps);

  // 단계별 테이블
  renderStepTable(steps, data.total_students);

  // 리더보드
  renderLeaderboard(data.leaderboard || []);
}

function chartDefaults() {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#8b92a0', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
      y: { ticks: { color: '#8b92a0', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
    }
  };
}

function renderCompletionChart(steps, totalStudents) {
  const labels = steps.map((s, i) => `Step ${i + 1}`);
  const vals   = steps.map(s => totalStudents > 0
    ? Math.round((s.completed / totalStudents) * 100) : 0);

  if (completionChart) completionChart.destroy();
  const ctx = document.getElementById('completion-chart').getContext('2d');
  completionChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: vals,
        backgroundColor: 'rgba(29,158,117,0.7)',
        borderColor: '#1D9E75',
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      ...chartDefaults(),
      scales: {
        ...chartDefaults().scales,
        y: { ...chartDefaults().scales.y, min: 0, max: 100,
          ticks: { ...chartDefaults().scales.y.ticks, callback: v => v + '%' } }
      }
    }
  });
}

function renderAttemptsChart(steps) {
  const labels = steps.map((s, i) => `Step ${i + 1}`);
  const vals   = steps.map(s => Math.round((s.avg_attempts || 0) * 10) / 10);

  if (attemptsChart) attemptsChart.destroy();
  const ctx = document.getElementById('attempts-chart').getContext('2d');
  attemptsChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: vals,
        backgroundColor: 'rgba(24,95,165,0.7)',
        borderColor: '#185FA5',
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: chartDefaults()
  });
}

function renderStepTable(steps, totalStudents) {
  const wrap = document.getElementById('step-table-wrap');
  if (!steps.length) { wrap.innerHTML = '<div class="empty-state">데이터 없음</div>'; return; }

  const rows = steps.map((s, i) => {
    const pct  = totalStudents > 0 ? Math.round((s.completed / totalStudents) * 100) : 0;
    const time = s.avg_time ? Math.round(s.avg_time) + 's' : '—';
    const att  = s.avg_attempts ? (Math.round(s.avg_attempts * 10) / 10) : '—';
    return `
      <tr>
        <td class="step-num">Step ${i + 1}</td>
        <td style="max-width:140px;font-size:12px;color:var(--text2)">${s.step_title || ''}</td>
        <td>
          <span class="step-pct">${pct}%</span>
          <div class="pct-bar"><div class="pct-bar-fill" style="width:${pct}%"></div></div>
        </td>
        <td class="step-num">${s.completed}</td>
        <td class="step-num">${att}</td>
        <td class="step-num">${time}</td>
      </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table class="step-table">
      <thead><tr>
        <th>단계</th><th>제목</th><th>완료율</th><th>완료</th><th>평균 시도</th><th>평균 시간</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderLeaderboard(lb) {
  const wrap = document.getElementById('leaderboard-wrap');
  if (!lb.length) { wrap.innerHTML = '<div class="empty-state">데이터 없음</div>'; return; }

  const maxSteps = lb[0]?.steps_completed || 1;
  const rows = lb.map((s, i) => {
    const rankCls = i < 3 ? 'lb-rank top3' : 'lb-rank';
    const medals  = ['🥇','🥈','🥉'];
    const rank    = i < 3 ? medals[i] : (i + 1);
    const pct     = Math.round((s.steps_completed / Math.max(maxSteps, 1)) * 100);
    return `
      <tr>
        <td class="${rankCls}">${rank}</td>
        <td class="lb-name">${escHtml(s.nickname)}</td>
        <td class="lb-steps">${s.steps_completed}</td>
        <td class="lb-bar-wrap">
          <div class="lb-bar"><div class="lb-bar-fill" style="width:${pct}%"></div></div>
        </td>
      </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table class="lb-table">
      <thead><tr><th>순위</th><th>닉네임</th><th>완료 단계</th><th>진척도</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function exportCSV() {
  const session = document.getElementById('session-input').value.trim();
  const url = session
    ? `${API_URL}/export?session=${encodeURIComponent(session)}`
    : `${API_URL}/export`;
  window.open(url, '_blank');
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 초기 로드 + 30초마다 자동 갱신
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
